<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IMG Delivery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#eef2f5}*{box-sizing:border-box}body{margin:0}header{background:#185987;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}header h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.85}nav{display:flex;gap:6px;margin-top:10px;overflow:auto}.tab{border:0;border-radius:9px;padding:9px 12px;font-weight:700}.tab.on{background:#fff;color:#185987}.tab:not(.on){background:#36749d;color:#fff}main{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d6dee4;border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}input,textarea{width:100%;padding:11px;border:1px solid #bcc8d0;border-radius:9px;font:inherit}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#185987;color:#fff}.secondary{background:#e6edf2}.danger{background:#922;color:#fff}.ok{color:#176b3a;font-weight:700}.bad{color:#9a2020;font-weight:700}.muted{color:#65727c;font-size:12px}.delivery{border:1px solid #d6dee4;border-radius:11px;padding:12px;margin:8px 0}.delivery h3{margin:0 0 5px;font-size:16px}.hidden{display:none!important}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8eef2;font-size:11px;font-weight:700}canvas{width:100%;height:180px;border:1px solid #bcc8d0;border-radius:9px;touch-action:none;background:white}.status{padding:9px 11px;border-radius:9px;background:#f4f7f9;margin-bottom:10px}@media(max-width:680px){.grid{grid-template-columns:1fr}nav{padding-bottom:2px}.btn{flex:1}}
</style>
</head>
<body>
<header><h1>IMG Delivery</h1><div class="sub">Support Services proof of delivery pilot</div><nav>
<button class="tab on" data-view="upcoming">Upcoming</button><button class="tab" data-view="new">New Delivery</button><button class="tab" data-view="completed">Completed</button><button class="tab" data-view="settings">Settings</button>
</nav></header>
<main>
<section id="upcoming"><div id="connection" class="status">Checking connection…</div><div class="card"><div class="row"><button class="btn primary" id="refresh">Refresh Queue</button></div><div id="queue"></div></div></section>
<section id="new" class="hidden"><div class="card"><h2 id="formTitle">Prepare Delivery</h2><div class="grid">
<div><label>Recipient Name *</label><input id="recipientName"></div><div><label>Recipient Email</label><input id="recipientEmail" type="email"></div>
<div><label>Delivery Location</label><input id="locationField"></div><div><label>Ticket / Request #</label><input id="ticket"></div>
<div><label>Scheduled Date & Time</label><input id="scheduledAt" type="datetime-local"></div><div><label>Delivered By</label><input id="deliveredBy"></div>
</div><div style="margin-top:10px"><label>Equipment</label><textarea id="equipment" placeholder="Laptop - Asset 12345\nMonitor - SN ABC123"></textarea></div><div style="margin-top:10px"><label>Notes</label><textarea id="notes"></textarea></div><div class="row" style="margin-top:10px"><button class="btn primary" id="saveDelivery">Save Delivery</button><button class="btn secondary" id="cancelEdit">Cancel</button></div></div></section>
<section id="completed" class="hidden"><div class="card"><h2>Completed Deliveries</h2><div id="completedList"></div></div></section>
<section id="settings" class="hidden"><div class="card"><h2>Shared Queue Settings</h2><div><label>Shared API URL</label><input id="apiUrl" placeholder="https://img-delivery-bridge-api.example.workers.dev"></div><div style="margin-top:10px"><label>Workspace ID</label><input id="workspace" value="img-support-services"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="saveSettings">Save & Test</button></div><div class="muted" style="margin-top:10px">Pilot only. Use fake data until the hosting/security model is approved.</div></div></section>
<section id="dropoff" class="hidden"><div class="card"><h2>Complete Drop-Off</h2><div id="dropSummary"></div><div style="margin-top:10px"><label>Proof Photo</label><input id="photo" type="file" accept="image/*" capture="environment"></div><div style="margin-top:10px"><label>Recipient Signature</label><canvas id="sig"></canvas><div class="row" style="margin-top:6px"><button class="btn secondary" id="clearSig">Clear Signature</button></div></div><div style="margin-top:10px"><label>Completion Notes</label><textarea id="completionNotes"></textarea></div><div class="row" style="margin-top:10px"><button class="btn primary" id="completeDelivery">Complete & Build Receipt</button><button class="btn secondary" id="cancelDrop">Cancel</button></div></div></section>
<section id="receipt" class="hidden"><div class="card"><h2>Receipt Ready</h2><div class="row"><button class="btn primary" id="sharePdf">Share PDF</button><button class="btn secondary" id="openEmail">Open Email</button><button class="btn secondary" id="backQueue">Back to Queue</button></div><div id="receiptInfo" class="muted" style="margin-top:10px"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const cfg={api:localStorage.getItem('img_api')||'',workspace:localStorage.getItem('img_workspace')||'img-support-services'};let deliveries=[],editingId=null,dropId=null,receiptBlob=null,receiptDelivery=null,photoData=null;
$('apiUrl').value=cfg.api;$('workspace').value=cfg.workspace;
function show(view){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(view).classList.remove('hidden');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===view))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{show(b.dataset.view);if(b.dataset.view==='upcoming'||b.dataset.view==='completed')loadQueue()});
function headers(){return {'content-type':'application/json','x-img-workspace':cfg.workspace}}
async function api(path,opt={}){if(!cfg.api)throw new Error('Shared API URL is not configured.');const r=await fetch(cfg.api.replace(/\/$/,'')+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){if(!s)return 'Unscheduled';const d=new Date(s);return isNaN(d)?s:d.toLocaleString()}
function setConn(ok,msg){$('connection').innerHTML=(ok?'<span class="ok">CONNECTED</span> ':'<span class="bad">NOT CONNECTED</span> ')+esc(msg||'')}
async function loadQueue(){try{const j=await api('/deliveries');deliveries=j.deliveries||[];setConn(true,'Shared queue online');render()}catch(e){deliveries=[];setConn(false,e.message);render()}}
function render(){const open=deliveries.filter(d=>d.status!=='completed');$('queue').innerHTML=open.length?'':"<div class='muted'>No upcoming deliveries.</div>";open.forEach(d=>{$('queue').insertAdjacentHTML('beforeend',`<div class="delivery"><h3>${esc(d.recipient_name)}</h3><div>${esc(d.location||'No location')} · ${esc(fmt(d.scheduled_at))}</div><div class="muted">${esc(d.equipment||'No equipment entered')}</div><div class="row" style="margin-top:8px"><button class="btn primary" onclick="startDrop('${d.id}')">Start Drop-Off</button><button class="btn secondary" onclick="editDelivery('${d.id}')">Edit</button><button class="btn secondary" onclick="duplicateDelivery('${d.id}')">Duplicate</button><button class="btn danger" onclick="deleteDelivery('${d.id}')">Delete</button></div></div>`)});const done=deliveries.filter(d=>d.status==='completed').sort((a,b)=>String(b.completed_at).localeCompare(String(a.completed_at)));$('completedList').innerHTML=done.length?'':"<div class='muted'>No completed deliveries.</div>";done.forEach(d=>$('completedList').insertAdjacentHTML('beforeend',`<div class="delivery"><h3>${esc(d.recipient_name)}</h3><div>${esc(d.location||'')} · Completed ${esc(fmt(d.completed_at))}</div><div class="muted">${esc(d.equipment||'')}</div></div>`))}
$('refresh').onclick=loadQueue;
$('saveSettings').onclick=async()=>{cfg.api=$('apiUrl').value.trim();cfg.workspace=$('workspace').value.trim()||'img-support-services';localStorage.setItem('img_api',cfg.api);localStorage.setItem('img_workspace',cfg.workspace);show('upcoming');await loadQueue()};
function formData(){return {recipient_name:$('recipientName').value.trim(),recipient_email:$('recipientEmail').value.trim(),location:$('locationField').value.trim(),ticket:$('ticket').value.trim(),scheduled_at:$('scheduledAt').value?new Date($('scheduledAt').value).toISOString():'',delivered_by:$('deliveredBy').value.trim(),equipment:$('equipment').value.trim(),notes:$('notes').value.trim()}}
function fill(d={}){$('recipientName').value=d.recipient_name||'';$('recipientEmail').value=d.recipient_email||'';$('locationField').value=d.location||'';$('ticket').value=d.ticket||'';$('scheduledAt').value=d.scheduled_at?new Date(d.scheduled_at).toISOString().slice(0,16):'';$('deliveredBy').value=d.delivered_by||'';$('equipment').value=d.equipment||'';$('notes').value=d.notes||''}
$('saveDelivery').onclick=async()=>{const body=formData();if(!body.recipient_name)return alert('Recipient name is required.');try{if(editingId)await api('/deliveries/'+encodeURIComponent(editingId),{method:'PUT',body:JSON.stringify(body)});else await api('/deliveries',{method:'POST',body:JSON.stringify(body)});editingId=null;fill();show('upcoming');await loadQueue()}catch(e){alert(e.message)}};
$('cancelEdit').onclick=()=>{editingId=null;fill();show('upcoming')};
window.editDelivery=id=>{const d=deliveries.find(x=>x.id===id);if(!d)return;editingId=id;fill(d);$('formTitle').textContent='Edit Delivery';show('new')};
window.duplicateDelivery=id=>{const d=deliveries.find(x=>x.id===id);if(!d)return;editingId=null;fill({...d,scheduled_at:''});$('formTitle').textContent='Duplicate Delivery';show('new')};
window.deleteDelivery=async id=>{if(!confirm('Delete this delivery?'))return;try{await api('/deliveries/'+encodeURIComponent(id),{method:'DELETE'});await loadQueue()}catch(e){alert(e.message)}};
window.startDrop=id=>{const d=deliveries.find(x=>x.id===id);if(!d)return;dropId=id;photoData=null;$('photo').value='';$('completionNotes').value='';clearSig();$('dropSummary').innerHTML=`<b>${esc(d.recipient_name)}</b><br>${esc(d.location||'')}<br><span class="muted">${esc(d.equipment||'')}</span>`;show('dropoff')};$('cancelDrop').onclick=()=>show('upcoming');
$('photo').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f){photoData=null;return}const r=new FileReader();r.onload=()=>photoData=r.result;r.readAsDataURL(f)};
const canvas=$('sig'),ctx=canvas.getContext('2d');function resizeSig(){const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.scale(dpr,dpr);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111'}resizeSig();window.addEventListener('resize',resizeSig);let drawing=false;function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]}canvas.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(...p)};canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(...p);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height)}$('clearSig').onclick=clearSig;
function dataUrlToBytes(url){const b=atob(url.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function imageFromData(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
function pdfFromJpeg(jpeg,w,h){const enc=s=>new TextEncoder().encode(s),parts=[],offset=[0];let len=0;const add=x=>{parts.push(x);len+=x.length};add(enc('%PDF-1.4\n'));function obj(n,body){offset[n]=len;add(enc(`${n} 0 obj\n${body}\nendobj\n`))}obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);const stream=`q\n${w} 0 0 ${h} 0 0 cm\n/Im0 Do\nQ`;obj(4,`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);offset[5]=len;add(enc(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`));add(jpeg);add(enc('\nendstream\nendobj\n'));const xref=len;add(enc('xref\n0 6\n0000000000 65535 f \n'));for(let i=1;i<=5;i++)add(enc(String(offset[i]).padStart(10,'0')+' 00000 n \n'));add(enc(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));return new Blob(parts,{type:'application/pdf'})}
async function buildReceipt(d){const c=document.createElement('canvas');c.width=1240;c.height=1754;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#17212b';x.font='bold 54px sans-serif';x.fillText('IMG Proof of Delivery',70,90);x.font='28px sans-serif';let y=150;const lines=[['Recipient',d.recipient_name],['Email',d.recipient_email],['Location',d.location],['Ticket',d.ticket],['Delivered By',d.delivered_by],['Completed',fmt(d.completed_at)],['Equipment',d.equipment],['Notes',d.completion_notes||d.notes]];for(const [k,v] of lines){x.font='bold 25px sans-serif';x.fillText(k+':',70,y);x.font='25px sans-serif';const txt=String(v||'');const chunks=txt.match(/.{1,70}(?:\s|$)/g)||[''];for(const ch of chunks){x.fillText(ch.trim(),260,y);y+=36}y+=12}if(photoData){try{const img=await imageFromData(photoData);const maxW=1100,maxH=520,s=Math.min(maxW/img.width,maxH/img.height,1);x.drawImage(img,70,y,img.width*s,img.height*s);y+=img.height*s+35}catch{}}x.font='bold 25px sans-serif';x.fillText('Recipient Signature:',70,y);y+=20;const sig=canvas.toDataURL('image/png');try{const si=await imageFromData(sig);x.drawImage(si,70,y,900,180)}catch{}x.font='20px sans-serif';x.fillText('Generated by IMG Delivery pilot',70,1690);const jpg=c.toDataURL('image/jpeg',0.88);return pdfFromJpeg(dataUrlToBytes(jpg),c.width,c.height)}
$('completeDelivery').onclick=async()=>{const d=deliveries.find(x=>x.id===dropId);if(!d)return;try{const completedAt=new Date().toISOString(),completionNotes=$('completionNotes').value.trim();const j=await api('/deliveries/'+encodeURIComponent(d.id),{method:'PUT',body:JSON.stringify({status:'completed',completed_at:completedAt,notes:[d.notes,completionNotes].filter(Boolean).join(' | ')})});receiptDelivery={...j.delivery,completion_notes:completionNotes};receiptBlob=await buildReceipt(receiptDelivery);$('receiptInfo').textContent='Receipt created for '+receiptDelivery.recipient_name+'. Share PDF opens the iPhone share sheet so Outlook can receive the attachment.';show('receipt');await loadQueue()}catch(e){alert(e.message)}};
$('sharePdf').onclick=async()=>{if(!receiptBlob)return;const f=new File([receiptBlob],`IMG-Delivery-${receiptDelivery.ticket||receiptDelivery.id}.pdf`,{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:'IMG Proof of Delivery',files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(receiptBlob);a.download=f.name;a.click()}}catch(e){if(e.name!=='AbortError')alert(e.message)}};
$('openEmail').onclick=()=>{if(!receiptDelivery)return;const sub=encodeURIComponent('IMG Proof of Delivery'+(receiptDelivery.ticket?' - '+receiptDelivery.ticket:''));const body=encodeURIComponent('Proof of delivery is ready. Attach the PDF generated by IMG Delivery.');location.href=`mailto:${encodeURIComponent(receiptDelivery.recipient_email||'')}?subject=${sub}&body=${body}`};$('backQueue').onclick=()=>{show('upcoming');loadQueue()};
if(cfg.api)loadQueue();else{setConn(false,'Open Settings and enter the Cloudflare Worker API URL.');render()}
setInterval(()=>{if(!document.hidden&&cfg.api&&!$('upcoming').classList.contains('hidden'))loadQueue()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg.api)loadQueue()});
</script>
</body></html>
