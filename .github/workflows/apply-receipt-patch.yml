name: Apply IMG receipt sharing patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-receipt-share.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply receipt sharing patch
        run: node scripts/patch-receipt-share.mjs
      - name: Validate frontend
        run: |
          node tests/validate.mjs
          node --check /tmp/img-delivery-inline.js
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix proof photo and Outlook receipt sharing"
          git push
