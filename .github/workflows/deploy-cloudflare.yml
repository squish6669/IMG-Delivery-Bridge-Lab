name: Deploy IMG Delivery Bridge API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: img-delivery-bridge
      WORKER_NAME: img-delivery-bridge-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          LIST_JSON=$(curl -fsS "${AUTH[@]}" "$API?per_page=100")
          DB_ID=$(echo "$LIST_JSON" | jq -r --arg name "$DB_NAME" '.result[]? | select(.name==$name) | .uuid' | head -n1)

          if [ -z "${DB_ID:-}" ]; then
            echo "Creating D1 database: $DB_NAME"
            CREATE_JSON=$(curl -fsS -X POST "${AUTH[@]}" --data "{\"name\":\"${DB_NAME}\"}" "$API")
            DB_ID=$(echo "$CREATE_JSON" | jq -r '.result.uuid // empty')
          else
            echo "Using existing D1 database: $DB_NAME"
          fi

          test -n "$DB_ID" || { echo "Could not resolve D1 database id"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved D1 database id: $DB_ID"

      - name: Generate deployment config
        shell: bash
        run: |
          cat > wrangler.deploy.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index.js"
          compatibility_date = "2026-09-08"

          [[d1_databases]]
          binding = "DB"
          database_name = "${DB_NAME}"
          database_id = "${{ steps.d1.outputs.database_id }}"
          EOF

      - name: Apply D1 schema
        run: npx wrangler d1 execute "$DB_NAME" --remote --file=schema.sql --config=wrangler.deploy.toml

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config=wrangler.deploy.toml 2>&1 | tee deploy.log

      - name: Show next step
        if: success()
        shell: bash
        run: |
          echo "Deployment succeeded."
          echo "Open the Worker URL shown in the Deploy Worker log, then paste that https://*.workers.dev URL into the app's Settings -> Shared API URL on both devices."
