name: Apply Signer Name Patch
on:
  push:
    paths:
      - 'scripts/add-signer-name.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node scripts/add-signer-name.mjs
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          open('/tmp/img-inline.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/img-inline.js
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then echo 'No changes needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Require and print signer name on delivery receipt'
          git push
